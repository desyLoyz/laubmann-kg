# Full 34-volume build against the DEDUPLICATED + PATCHED corpus, Gemini backend.
# Corpus chain (HistOrniGraph_addons/, see README_corpus.md):
#   corpus_2026-07-21 --apply_dedup.py--> corpus_dedup (Drive corpus_2026-07-21_dedup)
#   --dedup/apply_entry_boundaries.py + data/corpus_patches/entry_boundaries.csv--> corpus_patched
#   (missed entry headers, typed reports, register stops; entry_uids of corpus_dedup unchanged)
#   --build_multimodal_regions.py--> corpus_patched/multimodal_regions.jsonl
#   (catalogue v2 images/objects + selected text inserts, duplicates removed, relinked)
# Or pass --input-dir data/corpus_patched on the CLI.
# Requires: pip install -e ".[llm]"  and GOOGLE_API_KEY (or GEMINI_API_KEY).
# Calls are cached (data/cache/llm) at temperature 0, so an interrupted run
# resumes for free.
corpus:
  entries: data/corpus_patched/entries.csv
  multimodal: data/corpus_patched/multimodal_regions.jsonl

# Region crops (lkg:MultimodalRegion): set the public base URL once the images are
# hosted; the graph then carries schema:image <base_url>/<crop path> and the DwC-A
# multimedia identifier becomes that URL. null = crops referenced by path only.
multimodal:
  image_base_url: null

# null = all volumes. Set to a number to restrict to one volume.
sample:
  volume: null

extraction:
  backend: llm
  provider: google
  model: gemini-3.8-flash    # 2026-09-30 A/B on 68 entries: as good as 3.5, no runaway generations
                             #   (3.5: 6 of 68 hit the token cap), ~5x cheaper per call and much faster
  api_key_env: GOOGLE_API_KEY
  temperature: 0.0
  max_output_tokens: 32768  # long species-digest entries exceeded 16384 (22 truncated on
                            # 2026-08-17); truncated answers are never cached, so they re-run
  timeout: 600               # long digests (up to 38k characters) need minutes, not seconds
  thinking_level: low       # minimal | low | medium (API default) | high
  concurrency: 16           # parallel Gemini calls (3.8 Flash: ~1.3 calls/s at 12); lower on HTTP 429
  context_cache: true       # the prompt's instructions (up to "## Entry") are a Gemini CachedContent,
                            #   billed at the cached-input price (~4k of ~4.3k prompt tokens per call)
  retry_backoff: 2.0        # seconds, exponential — rides out transient 429s
  cache_dir: data/cache/llm_v4   # prompt v4 answers (copy to Drive llm_cache_v4 after the run;
                                 #   in Colab point it at Drive so interrupted runs resume)

# Visual reading before extraction: each entry's transcription is checked against the
# scan(s) of its page(s) (prompts/transcript_reading.md); corrections are applied to the
# text the extraction reads and listed in review/transcript_corrections.csv.
reading:
  enabled: true
  provider: google
  model: gemini-3.8-flash
  api_key_env: GOOGLE_API_KEY
  cache_dir: data/cache/reading_v1
  images_dir: data/pages_jpg      # tools/export_page_images.py (JPEG, 2000 px, one file per page_id)
  media_resolution: MEDIA_RESOLUTION_HIGH   # ~1,090 tokens per page (MEDIUM ~520; LOW too coarse for handwriting)
  max_pages: 12                   # an entry spans 1.43 pages on average, at most 20
  thinking_level: low
  max_output_tokens: 16384
  context_cache: true
  concurrency: 16
  timeout: 600
  decisions: data/review/transcript_decisions.csv   # reviewer decisions on the corrections (validation UI); absent = none

taxa:
  links_long_path: null       # set to the index linker's long table when available

corrections:                  # reviewer decisions on single mentions (validation UI export), applied before QA
  csv: data/review/value_corrections.csv   # absent file = no corrections
  observations: data/review/observation_corrections.csv   # single record fields (count, locality, date, observer,
                                           #   record type …) and records added by hand; absent = none

review:                       # validation UI decisions (tools/validation_ui, "Abgleich"); absent files = none
  identities: data/review/identities.csv              # name form -> entity (same/own/none) and entity links (link/nolink)
  text_corrections: data/review/text_corrections.csv  # corrected readings, applied before extraction (re-reads those entries)
  machine:                    # machine review (tools/validation_ui/machine_review, Claude Sonnet 5.5 subagents, 2026-09-30):
    enabled: true             #   fills the name forms and entity links nobody has reviewed; a row of identities.csv always wins
    identities: data/review/machine/identities_machine.csv
    georef: data/review/machine/georef_machine.csv   # place links of the georeference check (2026-10-26): places far from the
                                             #   rest of their entries, judged twice against the diary text; wins over identities_machine
    min_confidence: 0.9       #   machine rows need this confidence ...
    min_agreement: 2          #   ... and this many independent sources (text agent, scan agent, Gemini, Opus) agreeing
    value_corrections: data/review/machine/value_corrections_machine.csv   # single mentions the scan agent read differently
    observation_corrections: data/review/machine/observation_corrections_machine.csv   # record fields two scan checks agree on
    text_layer: data/review/machine/text_layer_machine.csv   # the checks' better readings (cut to the correction's span) and the scan
                                             #   agent's corrections of the text (build_review.py --machine-text-layer): apply=after is
                                             #   patched into the extracted entry, apply=before goes in before the extraction (read anew);
                                             #   a reviewer's decision wins, an entry with one is read anew
    text_values: data/review/machine/value_corrections_text_machine.csv   # the species and places the after-changes correct
    regions: data/review/machine/region_quality_machine.csv   # image and insert regions: duplicates, blank paper and fragments
                                             #   dropped, completeness and new crops where two checks agree (region_check.py, 2026-10-06)
    attribution: data/review/machine/attribution_machine.csv   # records of pasted reports and letters credited to the diarist:
                                             #   observer and record type where Gemini and Claude agree (attribution_check.py, 2026-10-05)
    min_correction_confidence: 0.9    #   (rows with an agreement column also need min_agreement)

qa:
  enabled: true
  exclude: true               # drop misdated entries + garbage taxa; recorded to review/qa_flags.csv
  decisions: data/review/qa_decisions.csv   # reviewer decisions on flags (validation UI): false_alarm drops the flag and its exclusion
  coverage:                   # volume time spans (title pages): OCR-year repair, misfiled scans, off-span entries
    enabled: true
    path: configs/volume_coverage.yaml
    tolerance_months: 1
    neighbours: 2
    max_digit_changes: 2
    # diary period = first title-page start … last title-page end (1917-04 … 1965-12) unless
    # earliest_year / latest_year are set here; entries outside it are dated by position
    # (digests, field notes) or excluded (kind other: obituaries)

resolution:                   # entity resolution after linking (review/*_merges.csv, decision column)
  enabled: true
  taxa:     {enabled: true, merge_on_scientific_name: true, reviewed_csv: data/review/taxon_merges.csv}
  persons:  {enabled: true, merge_bare_surname: true, reviewed_csv: data/review/person_merges.csv}
  places:   {enabled: true, similarity: 0.9, reviewed_csv: data/review/place_merges.csv}
  habitats: {enabled: true, similarity: 0.85, reviewed_csv: data/review/habitat_merges.csv}

linking:
  enabled: true              # absent/false = stage skipped entirely (offline runs, tests)
  offline: false             # true = answer only from the on-disk caches, never touch the network
  cache_dir: data/cache/linking   # gbif_cache.json + wikidata_cache.json (resumable, safe to interrupt)
  # review_dir: omitted = <output-dir>/review (taxon/person/place/habitat link reviews with a
  #   trailing decision column); never data/review, which holds the decisions the run reads
  limit: 0                   # cap uncached lookups per section per run (0 = all); partial runs resume via cache
  taxa:
    enabled: true
    reviewed_csv: null       # adjudicated taxon_link_review.csv from a prior run (decision y/yes/merge/1)
    sleep: 0.2               # seconds between uncached GBIF requests
    gbif:
      min_confidence: 90         # accept EXACT at/above -> skos:exactMatch
      fuzzy_min_confidence: 95   # accept FUZZY at/above -> skos:closeMatch
    llm:
      enabled: true
      provider: google
      model: gemini-3.5-flash    # stays 3.5: its Drive cache (linking_cache/llm) answers the known names
      api_key_env: GOOGLE_API_KEY
      cache_dir: data/cache/linking/llm            # Drive linking_cache/llm
      prompt_dir: prompts        # uses prompts/taxon_normalization.md (revived)
      min_confidence: 0.7        # LLM proposals below this go straight to review
      thinking_level: low        # minimal | low | medium | high
      max_output_tokens: 1024    # small JSON answer; headroom for thinking tokens
  persons:
    enabled: true
    reviewed_csv: null
    sleep: 0.5
    language: de
  places:                    # coordinates + GeoNames id + Wikidata item for the diary's places (review/place_link_review.csv)
    enabled: true
    reviewed_csv: data/review/place_link_review.csv   # y/n decisions of an earlier run (absent = none)
    min_uses: 1              # link every geocodable label (singletons included) when the Nominatim cache knows it
    max_km: 10               # a GeoNames record this close to the Nominatim point confirms the place
    keep_gazetteer_coordinates: true   # built-in gazetteer points stay; ids/uncertainty are added
    nominatim:
      cache: data/cache/linking/nominatim_cache.json   # pre-warmed by tools/prewarm_nominatim.py (Drive linking_cache/)
      live: false            # never hit Nominatim from the pipeline; set true for small ad-hoc runs (1 req / 1.1 s)
      email: ""
    geonames:
      dir: data/cache/linking/geonames    # country dumps (DE, AT, CH, IT, FR, GR, …) + index pickle, downloaded once
      download: true
  habitats:                  # EUNIS class per (resolved) habitat label; runs after entity resolution (review/habitat_link_review.csv)
    enabled: true
    reviewed_csv: data/review/habitat_link_review.csv
    vocabulary: data/eunis_habitats.csv      # tools/build_eunis_vocab.py (Eionet EUNIS habitats vocabulary)
    min_confidence: 0.7      # LLM confidence at/above -> linked (skos:*Match emitted); below -> review (the model's 0.7 is a defensible broad/close reading)
    review_confidence: 0.4   # below -> no_match
    batch_size: 40           # labels per LLM call (one cached call per batch)
    llm:
      enabled: true
      provider: google
      model: gemini-3.5-flash    # stays 3.5: its Drive cache (linking_cache/llm_habitats) answers the known labels
      api_key_env: GOOGLE_API_KEY
      cache_dir: data/cache/linking/llm_habitats   # Drive linking_cache/llm_habitats
      prompt_dir: prompts    # prompts/habitat_eunis.md
      thinking_level: low
      max_output_tokens: 8192

paths:
  ontology: ontologies/laubmann.ttl
  shapes: ontologies/shacl_shapes.ttl
  jsonld_context: schemas/jsonld_context.json

dwca:
  publisher: Laubmann KG Project
  license: CC-BY-4.0
  title: "Laubmann ornithological field diaries 1917–1965 — observations"
  package_id: laubmann-kg-full

validate: true
