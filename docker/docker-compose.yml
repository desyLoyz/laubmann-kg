version: "3.8"

services:
  fuseki:
    image: stain/jena-fuseki
    container_name: laubmann-fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin      # bitte für echten Betrieb ändern
      - JVM_ARGS=-Xmx2g           # RAM-Limit für die JVM, ggf. anpassen (34-Bände-Graph ist groß)
    volumes:
      - fuseki-data:/fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
