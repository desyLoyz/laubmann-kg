/* ---- graph (svg) ---- */
svg text { font-family: "Segoe UI", system-ui, sans-serif; fill: var(--ink); pointer-events: none; }

/* ---- map ui ---- */
#mapwrap { position: absolute; inset: 0; display: none; }
#mapwrap.on { display: block; }
#lmap { position: absolute; inset: 0; background: var(--bg); font: inherit; }
#lmap .leaflet-container { font: inherit; }
#mapbar { position: absolute; left: 54px; top: 10px; z-index: 500; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .76rem; color: var(--muted); }
#mapbar .grp { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
#mapbar .grp button { font-size: .72rem; padding: 2px 9px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
#mapbar .grp button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#mapfocus { position: absolute; left: 12px; right: 12px; bottom: 26px; z-index: 500; display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; pointer-events: none; }
#mapfocus > div { pointer-events: auto; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .76rem; color: var(--muted); max-width: 60%; }
#mapfocus b { color: var(--ink); font-weight: 600; }
#mapfocus .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
#mapoffline { display: none; position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%); z-index: 400; font-size: .8rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; pointer-events: none; }
#mapwrap.offline #mapoffline { display: block; }
.leaflet-container .leaflet-control-attribution, .leaflet-container .leaflet-control-scale-line { background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--muted); font-size: .66rem; border-color: var(--line); }
.leaflet-container .leaflet-control-attribution a { color: var(--accent); }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--surface); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-touch .leaflet-bar { border-color: var(--line); }
.leaflet-tooltip { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font-size: .76rem; padding: 3px 7px; box-shadow: none; }
.leaflet-tooltip.mlabel { background: none; border: 0; box-shadow: none; padding: 0 2px; font-size: .74rem; font-weight: 600; color: var(--ink); text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 3px var(--bg); }
.leaflet-tooltip.mlabel::before, .leaflet-tooltip.mlabel-top::before { display: none; }
.leaflet-tooltip-top::before { border-top-color: var(--line); } .leaflet-tooltip-bottom::before { border-bottom-color: var(--line); } .leaflet-tooltip-left::before { border-left-color: var(--line); } .leaflet-tooltip-right::before { border-right-color: var(--line); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.leaflet-popup-content { margin: 10px 12px; font: .8rem/1.5 "Segoe UI", system-ui, sans-serif; }
.leaflet-popup-content .prow { display: flex; justify-content: space-between; gap: 12px; }
.leaflet-popup-content .prow .muted { font-variant-numeric: tabular-nums; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
:root[data-theme="dark"] .leaflet-tile, .dark-tiles .leaflet-tile { filter: none; }

#runs { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:6px 14px; border-bottom:1px solid var(--line); background: var(--surface); font-size:.78rem; color:var(--muted); }
#runs label { display:inline-flex; align-items:center; gap:6px; }
#runs input[type=file] { font-size:.72rem; max-width:240px; }
#compare { position:absolute; inset:0; overflow:auto; padding:16px 20px 40px; display:none; background:var(--bg); z-index:3; }
#compare.on { display:block; }
.cmp-row { display:grid; grid-template-columns: minmax(140px, 1.4fr) 1fr 1fr minmax(120px, 1fr); gap:8px; padding:7px 8px; border-bottom:1px solid var(--line2); font-size:.82rem; cursor:pointer; }
.cmp-row:hover { background: var(--surface); }
.cmp-row.head { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); cursor:default; }
.pill.only-a { background:var(--warn-soft); color:var(--warn); }
.pill.only-b { background:var(--ext-soft); color:var(--ext); }
.pill.chg { background:var(--accent-soft); color:var(--accent); }
.cmp-cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
.cmp-cols h3 { margin-top:0; }
.cmp-miss { color:var(--muted); font-style:italic; }

<div id="loading">loading graph …</div>
<header>
  <h1>Laubmann KG · Explorer</h1>
  <span class="modes"><button type="button" data-mode="overview" aria-pressed="false">overview</button><button type="button" data-mode="graph" aria-pressed="true">graph</button><button type="button" data-mode="map" aria-pressed="false">map</button></span>
  <input id="q" type="search" placeholder="search  ·  date (1949-03), entry id, place, taxon, person, weather" autocomplete="off">
  <span class="field">volume <select id="vol"><option value="">all</option></select></span>
  <span class="field">years <input id="y0" type="number" style="width:68px" placeholder="from"> – <input id="y1" type="number" style="width:68px" placeholder="to"></span>
  <span class="stats" id="stats"></span>
</header>

<div id="runs">
  <span class="field">run A <input type="file" id="fileA" accept=".json,.json.gz,application/json" title="html/graph.json from a sample export"></span>
  <span class="field">run B <input type="file" id="fileB" accept=".json,.json.gz,application/json" title="second run to compare"></span>
  <span class="modes" id="runMode">
    <button type="button" id="btnA" data-run="A" aria-pressed="true">A</button>
    <button type="button" id="btnB" data-run="B" aria-pressed="false" disabled>B</button>
    <button type="button" id="btnCmp" data-run="compare" aria-pressed="false" disabled>compare</button>
  </span>
  <span id="runLabels" class="muted"></span>
</div>
<main>
  <aside id="side">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="entries" aria-selected="true">entries</button>
      <button role="tab" data-tab="taxa" aria-selected="false">taxa</button>
      <button role="tab" data-tab="places" aria-selected="false">places</button>
      <button role="tab" data-tab="persons" aria-selected="false">persons</button>
      <button role="tab" data-tab="weather" aria-selected="false">weather</button>
    </div>
    <div class="listbar"><span id="count"></span><span style="flex:1"></span>
      <span id="sortwrap">sort <select id="sort"><option value="date">date</option><option value="obs">observations</option><option value="vol">volume</option></select></span>
      <span id="geowrap" style="display:none"><label class="muted"><input type="checkbox" id="geo" style="vertical-align:-2px"> georeferenced only</label></span>
      <span id="wxwrap" style="display:none">precipitation <select id="wx"><option value="">any</option><option>rain</option><option>snow</option><option>sleet</option><option>hail</option><option>drizzle</option><option>fog</option><option>thunderstorm</option><option>none</option></select></span>
    </div>
    <div id="list"></div>
  </aside>
  <section id="graph">
    <div id="crumbs"></div>
    <div id="tools">
      <button type="button" id="tRand" title="open a random diary entry">random entry</button>
      <button type="button" id="tPred" aria-pressed="true" title="predicate labels along the edges — auto: shown for small graphs, when zoomed in (≥1.15×) or on hover · all: always · off: hover only">labels: auto</button>
      <button type="button" id="tFit" title="fit to view (double-click on the canvas)">fit</button>
      <button type="button" id="tSvg" title="download the current subgraph as SVG">SVG</button>
    </div>
    <svg id="svg" class="lbl-auto" viewBox="-500 -400 1000 800" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="hint">zoom in or hover a node to read the predicates on the edges</div>
    <div id="legend"></div>
    <div id="ov"></div>
    <div id="compare"></div>

    <div id="mapwrap"><div id="lmap"></div>
      <div id="mapbar"><span class="grp" id="basemaps"><button type="button" data-base="light" aria-pressed="true" title="CARTO Positron">light</button><button type="button" data-base="dark" aria-pressed="false" title="CARTO Dark Matter">dark</button><button type="button" data-base="osm" aria-pressed="false" title="OpenStreetMap standard">OSM</button><button type="button" data-base="topo" aria-pressed="false" title="OpenTopoMap — relief">topo</button></span>
        <span class="grp"><button type="button" id="mapAll" aria-pressed="false" title="show every georeferenced place again">all places</button><button type="button" id="mapFit" title="fit the map to the shown places">fit</button></span></div>
      <div id="mapfocus"><div id="mapfocusL"></div><div id="mapfocusR"></div></div>
      <div id="mapoffline">basemap tiles could not be loaded (offline?) — the places are still plotted</div>
    </div>
  </section>
  <button type="button" id="splitR" role="separator" aria-orientation="vertical" aria-label="Resize detail pane" title="Drag to resize the detail pane"></button>
  <section id="detail"><div class="muted small">select an entry, taxon, place, person or weather report</div></section>
</main>
<div id="tip" role="status"></div>

      if (!a) { kind = 'only-b'; onlyB++; }
      else if (!b) { kind = 'only-a'; onlyA++; }
      else if (na === nb && [...ka].every(x => kb.has(x)) && ka.size === kb.size) { kind = 'same'; same++; }
      else { kind = 'chg'; chg++; }
      return { id, a, b, na, nb, kind };
    });
    const C = document.getElementById('compare');
    C.innerHTML = `<h2>Compare sample runs</h2>
      <p class="sub">${esc(runNames.A || 'A')} vs ${esc(runNames.B || 'B')} · ${ids.length} entry ids</p>
      <div class="tiles">
        <div class="tile"><b>${fmt(GA.entries.length)}</b><span>entries A</span></div>
        <div class="tile"><b>${fmt(GB.entries.length)}</b><span>entries B</span></div>
        <div class="tile"><b>${fmt((GA.obs || []).length)}</b><span>obs A</span></div>
        <div class="tile"><b>${fmt((GB.obs || []).length)}</b><span>obs B</span></div>
        <div class="tile"><b>${fmt(onlyA)}</b><span>only in A</span></div>
        <div class="tile"><b>${fmt(onlyB)}</b><span>only in B</span></div>
        <div class="tile"><b>${fmt(chg)}</b><span>changed</span></div>
        <div class="tile"><b>${fmt(same)}</b><span>identical keys</span></div>
      </div>
      <div class="cmp-row head"><span>entry</span><span>A observations</span><span>B observations</span><span>status</span></div>
      ${rows.map((r, i) => `<div class="cmp-row" data-cmp="${i}">
        <span><b>${esc(r.id || '—')}</b> <span class="muted">${esc((r.a || r.b || {}).date || '')} ${(r.a || r.b || {}).pname ? '· ' + esc((r.a || r.b || {}).pname) : ''}</span></span>
        <span>${r.na == null ? '—' : fmt(r.na)}</span><span>${r.nb == null ? '—' : fmt(r.nb)}</span>
        <span><span class="pill ${r.kind}">${r.kind}</span></span>
      </div>`).join('')}
      <div id="cmpDetail"></div>`;
    C.querySelectorAll('[data-cmp]').forEach(row => row.addEventListener('click', () => {
      const r = rows[+row.dataset.cmp];
      const da = r.a ? obsNames(r.a, GA).map(esc).join('<br>') : '<span class="cmp-miss">not in A</span>';
      const db = r.b ? obsNames(r.b, GB).map(esc).join('<br>') : '<span class="cmp-miss">not in B</span>';
      document.getElementById('cmpDetail').innerHTML = `<div class="cmp-cols">
        <div><h3>${esc(runNames.A || 'A')}</h3><div class="small">${da || '<span class="muted">no observations</span>'}</div></div>
        <div><h3>${esc(runNames.B || 'B')}</h3><div class="small">${db || '<span class="muted">no observations</span>'}</div></div>
      </div>`;
    }));
  }
  async function parseGraphFile(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const gzip = bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
    if (gzip) return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function setActiveRun(which) {
    document.querySelectorAll('#runMode [data-run]').forEach(b => b.setAttribute('aria-pressed', b.dataset.run === which ? 'true' : 'false'));
    activeRun = which;
    if (which === 'compare') { renderCompare(); return; }
    const G = which === 'B' ? GB : GA;
    if (!G) return;
    ingest(G);
    startView();
  }
  async function onFile(which, file) {
    if (!file) return;
    const G = await parseGraphFile(file);
    runNames[which] = file.name.replace(/\.json(\.gz)?$/i, '');
    if (which === 'A') GA = G; else GB = G;
    document.getElementById('btnB').disabled = !GB;
    document.getElementById('btnCmp').disabled = !(GA && GB);
    updateRunLabels();
    if (which === 'A' || activeRun === which) setActiveRun(which);
    else if (activeRun === 'compare') renderCompare();
  }
  $('#fileA').addEventListener('change', ev => onFile('A', ev.target.files[0]));
  $('#fileB').addEventListener('change', ev => onFile('B', ev.target.files[0]));
  document.querySelectorAll('#runMode [data-run]').forEach(b => b.addEventListener('click', () => {
    if (!b.disabled) setActiveRun(b.dataset.run);
  }));
  (function wireDetailSplitter() {
    const main = document.querySelector('main');
    const split = document.getElementById('splitR');
    if (!main || !split) return;
    const KEY = 'lkg-explorer-detail-w';
    const MIN = 360, MIN_GRAPH = 240, MIN_SIDE = 200;
    const apply = w => {
      const max = Math.max(MIN, window.innerWidth - MIN_SIDE - MIN_GRAPH);
      w = Math.round(Math.min(max, Math.max(MIN, w)));
      main.style.setProperty('--detail-w', w + 'px');
      return w;
    };
    const current = () => parseInt(getComputedStyle(main).getPropertyValue('--detail-w'), 10);
    const stored = parseInt(localStorage.getItem(KEY) || '', 10);
    apply(Number.isFinite(stored) ? stored : Math.min(720, Math.max(640, Math.round(window.innerWidth * 0.38))));
    split.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      split.setPointerCapture(ev.pointerId);
      document.body.classList.add('resizing');
      const move = e => apply(main.getBoundingClientRect().right - e.clientX);
      const up = e => {
        document.body.classList.remove('resizing');
        try { split.releasePointerCapture(e.pointerId); } catch (_) { /* already released */ }
        localStorage.setItem(KEY, String(current()));
        split.removeEventListener('pointermove', move);
        split.removeEventListener('pointerup', up);
        split.removeEventListener('pointercancel', up);
      };
      split.addEventListener('pointermove', move);
      split.addEventListener('pointerup', up);
      split.addEventListener('pointercancel', up);
    });
    split.addEventListener('keydown', ev => {
      const step = ev.shiftKey ? 48 : 24;
      if (ev.key === 'ArrowLeft') { ev.preventDefault(); localStorage.setItem(KEY, String(apply(current() + step))); }
      if (ev.key === 'ArrowRight') { ev.preventDefault(); localStorage.setItem(KEY, String(apply(current() - step))); }
    });
    window.addEventListener('resize', () => { const w = current(); if (Number.isFinite(w)) apply(w); });
  })();
  fetch('graph.json').then(r => r.ok ? r.json() : Promise.reject()).then(G => {
    GA = G; runNames.A = (G.meta && (G.meta.model || G.meta.backend || G.meta.source)) || 'graph.json';
    updateRunLabels(); ingest(G); startView();
  }).catch(() => {
    hideLoading();
    const d = document.getElementById('detail');
    if (d) d.innerHTML = '<h2>Load a sample run</h2><p class="sub">Use <b>run A</b> in the bar above the page.</p><p>Choose <code>html/graph.json</code> from a folder under <code>data/exports/sample_runs/</code>. Optionally load a second export as <b>run B</b> and click <b>compare</b>.</p>';
  });
})();
</script>
