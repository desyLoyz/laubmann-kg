[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laubmann-kg"
version = "0.1.0"
description = "Laubmann knowledge graph processing pipeline"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "jsonschema>=4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
docs = [
    "pylode>=3.6",
    "kurra>=3.0,<3.1",
]
llm = [
    "google-genai>=0.3",
    "json-repair>=0.25",
]

[project.scripts]
laubmann-kg = "laubmann_kg.cli:app"

[tool.hatch.build]
sources = ["src"]
